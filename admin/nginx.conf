server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location ~ ^/(upload|addproduct|removeproduct|allproducts|images) {
        proxy_pass http://ecom-backend:4005;
        proxy_set_header Host $host;
    }
}