name: CI/CD - Build and Deploy Verification

on:
  push:
    branches:
      - main
      - test

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend image
        run: docker build -t ecom-backend ./backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend image
        run: docker build -t ecom-frontend ./frontend

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build admin image
        run: docker build -t ecom-admin ./admin

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-admin]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd Full-Stack-eCommerce-Website-MERN-Stack
            git pull origin main
            docker compose down
            docker compose up -d --build