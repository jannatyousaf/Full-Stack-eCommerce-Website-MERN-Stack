name: ecom-app
services:
  ecom-backend:
    build: 
     context: ./backend
    expose:
    - "4005"
    container_name: ecom-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/upload/images:/app/upload/images
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ecom-admin:
    build: 
     context: ./admin
    ports:
      - "5174:80"
    container_name: ecom-admin
    restart: always

  ecom-frontend:
    build: 
     context: ./frontend
    ports:
      - "3000:80"
    container_name: ecom-frontend
    restart: always
    


